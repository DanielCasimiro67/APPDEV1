<!DOCTYPE html>
<html>
<head><title>Daniel's DOM Playground</title></head>
<body>
  <button id="changeColorBtn">Change Background</button>
  <p id="message">This paragraph will update itself in 2 seconds.</p>

  <script>
    const button = document.getElementById("changeColorBtn");
    button.addEventListener("click", () => {
      const color = prompt("Pick a background color:");
      document.body.style.backgroundColor = color;
    });

    const message = document.getElementById("message");
    setTimeout(() => {
      message.textContent = "Updated! Two seconds have passed.";
    }, 2000);
  </script>
</body>
</html>
